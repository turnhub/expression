name: Hex.pm releases

on:
  release:
    types: [published]

env:
  ELIXIR_VERSION: "1.19"
  OTP_VERSION: "28"
  # when updating this, please also see ./elixir.yml
  CACHE_VERSION: "4"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Setup BEAM
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: mix-cache
        with:
          path: deps
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-mix-

      - name: Install Mix Dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Verify versions match release tag
        run: |
          # Extract version from release tag (removes 'v' prefix if present)
          RELEASE_VERSION="${{ github.event.release.tag_name }}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          echo "Release version: $RELEASE_VERSION"

          # Extract current version from mix.exs
          MIX_VERSION=$(grep -oP '@version "\K[^"]+' mix.exs)
          echo "mix.exs version: $MIX_VERSION"

          # Extract current version from README.md
          README_VERSION=$(grep -oP '\{:expression, "~> \K[^"]+' README.md)
          echo "README.md version: $README_VERSION"

          # Verify versions match
          if [ "$MIX_VERSION" != "$RELEASE_VERSION" ] || [ "$README_VERSION" != "$RELEASE_VERSION" ]; then
            echo ""
            echo "ERROR: Version mismatch detected!"
            echo "  Release tag: $RELEASE_VERSION"
            echo "  mix.exs:     $MIX_VERSION"
            echo "  README.md:   $README_VERSION"
            echo ""
            echo "Please update mix.exs and README.md to match the release version before publishing."
            exit 1
          fi

          echo "All versions match $RELEASE_VERSION"

      - name: Publish to Hex.pm
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix hex.organization auth turnio --key ${{ secrets.HEX_ORG_KEY }}
          mix do deps.get, deps.compile
          mix compile
          mix hex.build
          mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
